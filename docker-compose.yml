version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tienda_user
      POSTGRES_PASSWORD: tienda_pass
      POSTGRES_DB: tienda_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 tienda.wsgi:application"
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-dev-key-change-in-production"
      DATABASE_URL: postgresql://tienda_user:tienda_pass@db:5432/tienda_db
      DB_NAME: tienda_db
      DB_USER: tienda_user
      DB_PASSWORD: tienda_pass
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api,web"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://web:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/api/v1
      NODE_ENV: development
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
